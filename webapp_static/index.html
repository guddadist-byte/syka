<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="stylesheet" href="style.css">

<div id="app">

      <div class="app-title" id="headerTitle">GUDDA CRM</div>
      <div class="app-subtitle" id="headerSubtitle">загрузка…</div>
    </div>

</html>
