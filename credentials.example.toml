# One-time bootstrap file for Avito / AI / proxy credentials.
#
# Everything here is normally editable later from the Telegram admin panel
# ("⚙️ Настройки") and lives in the database from then on. This file only
# saves you from typing everything through bot forms on first deploy.
#
# Copy this file to credentials.toml (gitignored) and fill in real values.
# Seeding is idempotent and only fills in DB rows that are still at their
# defaults — it will never overwrite something you already changed via the
# bot's admin panel. It's safe to leave this file in place across restarts,
# or to delete it once you're done with the initial setup.

[[avito_accounts]]
name = "Аккаунт 1"
avito_user_id = 0
client_id = "REPLACE_ME"
client_secret = "REPLACE_ME"

# Repeat the [[avito_accounts]] block for each Avito account (the network
# typically runs ~4 accounts covering ~20 physical points/addresses).
#
# [[avito_accounts]]
# name = "Аккаунт 2"
# avito_user_id = 0
# client_id = "REPLACE_ME"
# client_secret = "REPLACE_ME"

[ai]
base_url = "https://tooken.club/v1"
model = "gpt-5.6-sol"
api_key = "REPLACE_ME"
extra_header_name = "X-Tooken-Client"
extra_header_value = "codex"

[proxy]
enabled = false
# http://host:port or socks5://host:port
url = ""
login = ""
password = ""
